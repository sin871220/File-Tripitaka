name: Build Windows EXE
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests -v
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name FileManDaejanggyeong --icon assets/app.ico --additional-hooks-dir hooks --add-data "fonts;fonts" --add-data "assets;assets" app.py
      - uses: actions/upload-artifact@v4
        with:
          name: FileManDaejanggyeong-Windows
          path: dist/FileManDaejanggyeong.exe
